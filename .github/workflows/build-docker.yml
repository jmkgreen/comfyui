name: Build Docker Image

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - profile: ada
            tag: cu128-ada
            allow_blackwell: "0"
            sageattention_wheel_url: https://github.com/Comfy-Org/wheels/releases/download/sageattention-latest/sageattention-2.2.0%2Bcu128torch2.10-cp312-cp312-manylinux_2_34_x86_64.manylinux_2_35_x86_64.whl
          - profile: blackwell
            tag: cu128-blackwell-experimental
            allow_blackwell: "1"
            sageattention_wheel_url: https://huggingface.co/yo9otatara/prebuilt_wheels/resolve/main/sageattention-2.2.0%2Bcu128torch2.10.0sm120-cp312-cp312-linux_x86_64.whl

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Free runner disk space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: false
          docker-images: true
          swap-storage: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to the Container registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=${{ matrix.tag }}
            type=ref,event=branch,suffix=-${{ matrix.profile }}
            type=ref,event=pr,suffix=-${{ matrix.profile }}
            type=sha,suffix=-${{ matrix.profile }}
            type=raw,value=latest,enable=${{ matrix.profile == 'ada' && github.ref == 'refs/heads/main' }}

      - name: Build Docker image (${{ matrix.profile }})
        uses: docker/build-push-action@v7
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            SAGEATTENTION_WHEEL_URL=${{ matrix.sageattention_wheel_url }}
            ALLOW_SAGE_ATTENTION_BLACKWELL=${{ matrix.allow_blackwell }}
          cache-from: type=gha,scope=${{ matrix.profile }}
          cache-to: type=gha,mode=max,scope=${{ matrix.profile }}
